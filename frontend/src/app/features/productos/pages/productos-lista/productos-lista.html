<app-navbar></app-navbar>
<app-carousel></app-carousel>

<main>
  <app-filters (apply)="aplicarFiltros($event)"></app-filters>

  <section style="flex:1;">
    <div class="content-top">
      <div>Mostrando {{ mostrados.length }} artículos</div>

      <div class="sort">
        <label for="sortSelect">Ordenar:</label>
        <select id="sortSelect" (change)="onSortChange($event)">
          <option value="relevance">Relevancia</option>
          <option value="price_asc">Precio: menor a mayor</option>
          <option value="price_desc">Precio: mayor a menor</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div *ngFor="let p of mostrados" class="card">
        <img class="producto-img" [src]="p.img" [alt]="p.titulo" />
        <div class="title">{{ p.titulo }}</div>
        <div class="price">€{{ p.precio }}</div>
        <div class="price-row">
          <button type="button" class="add" (click)="agregar(p)">Añadir</button>
        </div>
      </div>
    </div>
  </section>
</main>

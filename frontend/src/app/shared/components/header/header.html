<header>
  <div class="topbar">
    <div class="logo" aria-label="Legados Collector">
      <div class="badge">LC</div>
      <div>
        <div class="brand">Legados</div>
        <div class="tag">Collector — Reliquias y Antigüedades</div>
      </div>
    </div>

    <div class="searchbar" role="search">
      <input [(ngModel)]="query" placeholder="Buscar reliquias, antigüedades, colecciones..." />
      <button type="button" (click)="buscar()">Buscar</button>
    </div>

    <div class="icons">
      <button type="button" class="icon">Cuenta</button>
      <button type="button" class="icon">Pedidos</button>
      <button type="button" class="icon carrito" (click)="toggleCarrito()">
        Carrito <span class="cart-count">{{ cantidadCarrito }}</span>
      </button>
    </div>
  </div>

  <app-mini-carrito [class.visible]="mostrarMiniCarrito"></app-mini-carrito>
</header>
